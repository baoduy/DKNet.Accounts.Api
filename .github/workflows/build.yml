name: Build & Test

on:
  workflow_dispatch: {}
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

concurrency:
  # One run of this pipeline per branch at a time; a newer commit cancels the older in-flight run.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  Project_Path: 'DKNet.Accounts.sln'
  Dotnet_Version: 10.x

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.Dotnet_Version }}

      # `dev` carries no solution until the DRK-1240 scaffold lands. Remove this
      # guard and the `if:` conditions below once the solution is on `dev`.
      - name: Check solution present
        id: sln
        run: |
          if [ -f "${{ env.Project_Path }}" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ env.Project_Path }} not found — nothing to build yet."
          fi

      - name: Restore dependencies
        if: steps.sln.outputs.found == 'true'
        run: dotnet restore ${{ env.Project_Path }}

      - name: Build
        if: steps.sln.outputs.found == 'true'
        run: dotnet build ${{ env.Project_Path }} --no-restore --configuration Release

      - name: Test
        if: steps.sln.outputs.found == 'true'
        run: dotnet test ${{ env.Project_Path }} --no-build --configuration Release --verbosity minimal
