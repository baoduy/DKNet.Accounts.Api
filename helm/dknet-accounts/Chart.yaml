apiVersion: v2
name: dknet-accounts
description: Umbrella chart deploying the DKNet.Accounts API and its console (ui/) to AKS, both built on drunk-app.
type: application
version: 0.1.0
appVersion: "1.0.0"

# drunk-app (https://github.com/baoduy/drunk.charts) supplies the Deployment/Service/
# SecretProviderClass/HTTPRoute templates for both sides via two aliased instances.
#
# Version pin: the ticket asked for "drunk-app 2.x", and 2.0.0 already exists on the
# drunk.charts `main` branch, but its published Helm repo index
# (https://baoduy.github.io/drunk.charts/drunk-app/index.yaml) is not yet republished
# with it — `helm search repo` resolves no higher than 1.3.9 today. 1.3.9's templates
# are byte-identical to 2.0.0's (same secretProvider/httpRoute/deployment logic), so
# pinning here costs nothing functionally. Bump to `2.x.x` once that index is updated.
dependencies:
  - name: drunk-app
    version: 1.3.x
    repository: https://baoduy.github.io/drunk.charts/drunk-app
    alias: api
    condition: api.enabled
  - name: drunk-app
    version: 1.3.x
    repository: https://baoduy.github.io/drunk.charts/drunk-app
    alias: console
    condition: console.enabled
