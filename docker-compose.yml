services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accounts}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounts -d accounts"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${API_IMAGE:-ghcr.io/baoduy/dknet.accounts-api:latest}
    # ghcr's current :latest has USER "$APP_UID" as a literal string, which docker cannot resolve
    # ("unable to find user $APP_UID"). The csproj now names the base image's user explicitly, so drop
    # this line once a :latest built after that fix is published.
    user: "1654:1654"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Feature flags and auth live in .env — see .env.sample.
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AppDb: Host=postgres;Database=accounts;Username=accounts;Password=${POSTGRES_PASSWORD:-accounts}
      ConnectionStrings__Redis: redis:6379
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
