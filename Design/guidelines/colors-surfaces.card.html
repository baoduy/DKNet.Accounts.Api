<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="An off-white ground with white cards, so a card lifts by value and by shadow." -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}.g{display:flex;gap:10px;align-items:stretch}.sw{flex:1;min-width:0;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--card);box-shadow:var(--shadow-card)}.chip{height:56px;border-bottom:1px solid var(--border)}.meta{padding:8px}.n{font-size:12px;line-height:16px;font-weight:600}.v{font-family:var(--font-mono);font-size:10px;line-height:14px;color:var(--muted-foreground)}.lab{font-size:11px;line-height:15px;font-weight:600;letter-spacing:.05em;color:var(--muted-foreground);text-transform:uppercase;margin:0 0 8px}.note{font-size:12px;line-height:17px;color:var(--muted-foreground);margin-top:12px}</style></head><body><div class="g"><div class="sw"><div class="chip" style="background:var(--background)"></div><div class="meta"><div class="n">--background</div><div class="v">#fbfcf8</div></div></div><div class="sw"><div class="chip" style="background:var(--card)"></div><div class="meta"><div class="n">--card</div><div class="v">#ffffff</div></div></div><div class="sw"><div class="chip" style="background:var(--popover)"></div><div class="meta"><div class="n">--popover</div><div class="v">#ffffff</div></div></div><div class="sw"><div class="chip" style="background:var(--muted)"></div><div class="meta"><div class="n">--muted</div><div class="v">#f1f5f9</div></div></div></div>
<div class="note">The ground carries a trace of warmth against the slate ramp; cards are pure white on top of it. <span class="v">--muted</span> is table headers, row hover and chips.</div></body></html>
