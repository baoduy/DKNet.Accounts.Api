<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}.g{display:flex;gap:10px;align-items:stretch}.sw{flex:1;min-width:0;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}.chip{height:56px}.meta{padding:7px 9px;background:var(--card);border-top:1px solid var(--border)}.n{font-size:12px;line-height:16px;font-weight:600}.v{font-family:var(--font-mono);font-size:11px;line-height:15px;color:var(--muted-foreground)}.lab{font-size:11px;line-height:15px;font-weight:600;letter-spacing:.05em;color:var(--muted-foreground);text-transform:uppercase}.note{font-size:12px;line-height:16px;color:var(--muted-foreground);margin-top:10px}</style></head><body><div style="font-family:var(--font-mono);font-size:14px;line-height:24px">
<div><span style="display:inline-block;width:19px">🇸🇬</span>SGD</div>
<div><span style="display:inline-block;width:19px">🇺🇸</span>USD</div>
<div><span style="display:inline-block;width:19px">🇯🇵</span>JPY</div>
<div><span style="display:inline-block;width:19px"></span>XAU</div>
</div>
<div class="note">A flag alone is not a currency — several countries use the dollar. XAU, XAG and XDR have no country and EUR maps to a union: those render the code alone in the reserved slot, with no substitute globe or question mark. Never use the pair in prose; body text takes the bare code.</div></body></html>
