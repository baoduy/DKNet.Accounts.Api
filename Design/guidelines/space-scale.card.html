<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}.g{display:flex;gap:10px;align-items:stretch}.sw{flex:1;min-width:0;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}.chip{height:56px}.meta{padding:7px 9px;background:var(--card);border-top:1px solid var(--border)}.n{font-size:12px;line-height:16px;font-weight:600}.v{font-family:var(--font-mono);font-size:11px;line-height:15px;color:var(--muted-foreground)}.lab{font-size:11px;line-height:15px;font-weight:600;letter-spacing:.05em;color:var(--muted-foreground);text-transform:uppercase}.note{font-size:12px;line-height:16px;color:var(--muted-foreground);margin-top:10px}</style></head><body><div style="display:flex;gap:16px;align-items:flex-end"><div style="text-align:center"><div style="width:var(--space-1);height:var(--space-1);background:var(--primary);border-radius:2px;margin:0 auto 6px"></div><div class="v">--space-1</div></div><div style="text-align:center"><div style="width:var(--space-2);height:var(--space-2);background:var(--primary);border-radius:2px;margin:0 auto 6px"></div><div class="v">--space-2</div></div><div style="text-align:center"><div style="width:var(--space-3);height:var(--space-3);background:var(--primary);border-radius:2px;margin:0 auto 6px"></div><div class="v">--space-3</div></div><div style="text-align:center"><div style="width:var(--space-4);height:var(--space-4);background:var(--primary);border-radius:2px;margin:0 auto 6px"></div><div class="v">--space-4</div></div><div style="text-align:center"><div style="width:var(--space-6);height:var(--space-6);background:var(--primary);border-radius:2px;margin:0 auto 6px"></div><div class="v">--space-6</div></div><div style="text-align:center"><div style="width:var(--space-8);height:var(--space-8);background:var(--primary);border-radius:2px;margin:0 auto 6px"></div><div class="v">--space-8</div></div><div style="text-align:center"><div style="width:var(--space-12);height:var(--space-12);background:var(--primary);border-radius:2px;margin:0 auto 6px"></div><div class="v">--space-12</div></div></div>
<div class="note">Every step and every density value derives from <span class="v">--spacing</span> (0.25rem) by a whole multiple, so nothing sits off the grid: <span class="v">--card-padding</span> 20px, <span class="v">--page-padding</span> 28px, <span class="v">--row-height</span> 44px, <span class="v">--cell-padding-x</span> 16px.</div></body></html>
