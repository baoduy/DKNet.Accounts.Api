<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}.g{display:flex;gap:10px;align-items:stretch}.sw{flex:1;min-width:0;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}.chip{height:56px}.meta{padding:7px 9px;background:var(--card);border-top:1px solid var(--border)}.n{font-size:12px;line-height:16px;font-weight:600}.v{font-family:var(--font-mono);font-size:11px;line-height:15px;color:var(--muted-foreground)}.lab{font-size:11px;line-height:15px;font-weight:600;letter-spacing:.05em;color:var(--muted-foreground);text-transform:uppercase}.note{font-size:12px;line-height:16px;color:var(--muted-foreground);margin-top:10px}</style></head><body><div style="font-family:var(--font-mono);font-size:13px;line-height:20px">ACME-000123<br>ACME-000132<br>POST-000124<br>b2f49c11-4a07-8e33-1d05-77ac41bb0e92</div>
<div class="note"><span style="font-family:var(--font-mono)">ACME-000123</span> against <span style="font-family:var(--font-mono)">ACME-000132</span> is a one-glance difference in mono and a two-read difference in a proportional face. Account numbers, posting numbers, group codes, ids, idempotency keys and refusal codes all take it.</div></body></html>
