<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}.g{display:flex;gap:10px;align-items:stretch}.sw{flex:1;min-width:0;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}.chip{height:56px}.meta{padding:7px 9px;background:var(--card);border-top:1px solid var(--border)}.n{font-size:12px;line-height:16px;font-weight:600}.v{font-family:var(--font-mono);font-size:11px;line-height:15px;color:var(--muted-foreground)}.lab{font-size:11px;line-height:15px;font-weight:600;letter-spacing:.05em;color:var(--muted-foreground);text-transform:uppercase}.note{font-size:12px;line-height:16px;color:var(--muted-foreground);margin-top:10px}</style></head><body><div style="display:flex;gap:20px;align-items:flex-start"><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><span style="display:inline-block;font-size:12px;line-height:16px;font-weight:500;padding:2px 8px;border-radius:var(--radius-full);background:var(--badge-credit-bg);color:var(--badge-credit-fg)">Active</span><span class="v">credit</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><span style="display:inline-block;font-size:12px;line-height:16px;font-weight:500;padding:2px 8px;border-radius:var(--radius-full);background:var(--badge-warning-bg);color:var(--badge-warning-fg)">Dormant</span><span class="v">warning</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><span style="display:inline-block;font-size:12px;line-height:16px;font-weight:500;padding:2px 8px;border-radius:var(--radius-full);background:var(--badge-debit-bg);color:var(--badge-debit-fg)">Frozen</span><span class="v">debit</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><span style="display:inline-block;font-size:12px;line-height:16px;font-weight:500;padding:2px 8px;border-radius:var(--radius-full);background:var(--badge-info-bg);color:var(--badge-info-fg)">Posted</span><span class="v">info</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><span style="display:inline-block;font-size:12px;line-height:16px;font-weight:500;padding:2px 8px;border-radius:var(--radius-full);background:var(--badge-neutral-bg);color:var(--badge-neutral-fg)">Closed</span><span class="v">neutral</span></div></div>
<div class="note">Severity is carried by hue: orange blocks half of what you can do, rose blocks all of it.</div></body></html>
