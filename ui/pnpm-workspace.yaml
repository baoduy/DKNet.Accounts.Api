allowBuilds:
  esbuild: true
  sharp: true
# Waiver for the pinned `next@15.5.26` CVE fix (A5): pnpm's default minimum-release-age
# guard would otherwise block installing a release this recent. Remove this list at the
# next `next` version bump.
minimumReleaseAgeExclude:
  - '@next/env@15.5.26'
  - '@next/swc-darwin-arm64@15.5.26'
  - '@next/swc-darwin-x64@15.5.26'
  - '@next/swc-linux-arm64-gnu@15.5.26'
  - '@next/swc-linux-arm64-musl@15.5.26'
  - '@next/swc-linux-x64-gnu@15.5.26'
  - '@next/swc-linux-x64-musl@15.5.26'
  - '@next/swc-win32-arm64-msvc@15.5.26'
  - '@next/swc-win32-x64-msvc@15.5.26'
  - next@15.5.26
onlyBuiltDependencies:
  - esbuild
  - sharp
